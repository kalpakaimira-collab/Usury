<style>
:root{--bg:#efe3df;--ink:#4a1a20;--wine:#7a1f2b;--gold:#b8924a;--card:#5a121c;--cardink:#f6e9e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241014;--ink:#f1dfd8;--wine:#d9a0a0;--gold:#d2ad66;--card:#3b0d14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241014;--ink:#f1dfd8;--wine:#d9a0a0;--gold:#d2ad66;--card:#3b0d14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:1.2rem;line-height:1.6;text-align:center}
.wrap{max-width:30rem;margin:0 auto}
.hero{position:relative}
.hero img{display:block;width:100%;height:min(88svh,46rem);object-fit:cover;object-position:50% 12%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 52%,var(--bg) 97%)}
.title{position:relative;z-index:1;margin-top:-7.5rem;padding:0 1rem}
.name{font-family:"Marck Script","Cormorant Garamond",cursive;font-weight:400;font-size:clamp(5rem,26vw,8rem);line-height:1;margin:0;color:var(--wine)}
.kind{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:600;letter-spacing:.18em;margin:.2rem 0 0;color:var(--wine)}
.invite{padding:2.5rem 1.5rem 1rem}
.invite p{margin:0 auto;max-width:24rem}
.invite .sig{margin-top:1.2rem;font-style:italic;color:var(--wine)}
.card{margin:2rem 1.25rem;padding:2rem 1.25rem;background:var(--card);color:var(--cardink);outline:1px solid var(--gold);outline-offset:-.6rem}
.card h2{font-size:1rem;font-weight:500;margin:0;color:var(--gold);letter-spacing:.06em}
.big{font-size:2.4rem;font-weight:600;line-height:1.15;margin:.2rem 0 1.4rem}
.big small{display:block;font-size:1.2rem;font-weight:400;opacity:.85}
.card p{margin:.2rem 0 1.4rem}
.count{display:flex;justify-content:center;gap:1.4rem;margin:.6rem 0 0}
.count b{display:block;font-size:2.2rem;font-weight:600;line-height:1.1}
.count span{font-size:.95rem;color:var(--gold)}
.btn{display:inline-block;margin:0 0 2.5rem;padding:.8rem 2rem;border:1px solid var(--wine);color:var(--wine);text-decoration:none;font-size:1.1rem;font-weight:600}
.btn:hover,.btn:focus-visible{background:var(--wine);color:var(--bg);outline:none}
.foot{padding:0 1.5rem 3rem;font-family:"Marck Script",cursive;font-size:1.7rem;color:var(--wine)}
</style>
</head>
